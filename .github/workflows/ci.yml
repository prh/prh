name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # lib/raw.ts の変更が prh.schema.json に反映済みか確認する
      - run: git diff --exit-code prh.schema.json
      - run: npm test
